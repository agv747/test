# Must match the deployed Worker, otherwise `wrangler deploy` creates a second copy
# of the app instead of updating the live one.
# Live at: https://price-check.anton-grebelny.workers.dev
name = "price-check"
compatibility_date = "2024-09-23"
main = "worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# NOTE: binding AI makes `wrangler dev` open a remote proxy session, which needs Cloudflare
# credentials. For offline work use `npm run dev:local`, which loads wrangler.local.toml.
#
# Vision models for price recognition. The model runs server-side through this binding, so
# no credential is ever shipped to a device a TME carries into a shop. Without it,
# /api/recognise returns 503 and only the MVP Simulator is usable.
[ai]
binding = "AI"

# Shared observation store. Without this binding the API returns 503 and the client falls
# back to its bundled seed data, so the app still runs on a plain static host.
[[d1_databases]]
binding = "DB"
database_name = "retail-price-intelligence"
database_id = "9fabe7e1-fb10-455b-adf8-15bcb16a8f5d"

# Optional secrets, set with `npx wrangler secret put <NAME>` or in the dashboard under
# Settings → Variables and Secrets. Never commit their values.
#
#   OPENAI_API_KEY  enables the OpenAI models; read only by the Worker, never returned
#   SEED_TOKEN      allows re-seeding a database that already holds data
#   AI_GATEWAY_ID   overrides the AI Gateway used for third-party models (default: "default")
